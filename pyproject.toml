[project]
name = "banking-fx-data-pipeline"
version = "0.1.0"
description = "An automated pipeline for collecting, validating, transforming, and storing foreign exchange rate data from the Frankfurter API."
readme = "README.md"
authors = [
    { name = "Adobea Essien", email = "reginaessien83@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "polars>=2.1.0",
    "prefect>=3.9.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
banking-fx-data-pipeline = "banking_fx_data_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]