
# How Prefect Cloud gets and runs this project's code.
name: banking-fx-data-pipeline

pull:
  - prefect.deployments.steps.git_clone:
      id: clone
      repository: https://github.com/adobea-dev/Banking_FX_Data_Pipeline.git
      branch: main

  - prefect.deployments.steps.set_working_directory:
      directory: "{{ clone.directory }}/src"



deployments:
  - name: hello
    entrypoint: banking_fx_data_pipeline/hello.py:hello_pipeline
    parameters:
      name: Prefect Cloud
    work_pool:
      name: my-managed-pool
    schedules:
      - cron: "0 9 * * 1-5"
        timezone: Africa/Accra

  - name: fx-sketch
    entrypoint: banking_fx_data_pipeline/plan_sketch.py:fx_pipeline
    work_pool:
      name: my-managed-pool

